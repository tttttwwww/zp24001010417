# ============================================
# 第01步：Spring Boot 项目搭建 —— 配置文件
# 第03步：接入 MySQL + MyBatis Plus
# 第06步：JWT 认证（签名密钥 + 过期时间）
# 注意：yml 靠缩进表示层级，空格必须对齐
# ============================================
server:
  port: 8080
  servlet:
    # 所有接口统一加 /api 前缀
    context-path: /api

spring:
  application:
    name: recruitment-website
  jackson:
    serialization:
      write-dates-as-timestamps: false
    # 以后 JSON 里的时间按东八区、yyyy-MM-dd HH:mm:ss 输出
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # ---------- 第03步新增：数据源（本机开发账号） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recruitment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

# ---------- 第03步新增：MyBatis Plus（与 spring 同级，顶格写） ----------
mybatis-plus:
  configuration:
    # 表字段 company_name 自动对应 Java 的 companyName
    map-underscore-to-camel-case: true
    # 控制台打印执行的 SQL，方便对照
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增，与建表语句的 AUTO_INCREMENT 一致
      id-type: auto

# ---------- 第06步新增：JWT ----------
jwt:
  # 签名密钥 32–47 字符，用于签名和验签；换一把密钥旧 Token 就无法通过验证
  secret: recruitment-website-jwt-secret-key-2024-web-architecture-course
  # 7 天，单位毫秒
  expiration: 604800000
